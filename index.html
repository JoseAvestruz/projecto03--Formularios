<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css">
    <title>Crie seu evento</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Poppins&display=swap"rel="stylesheet"/>
  </head>
<body>
    <div id="page">
         <header>
        <h1>Crie e compartilhe seu evento.</h1>
        <br>
        <p>O primeiro passo, é preecher esse furmulario de inscrição</p>
    </header>
 
    <form id="my-form">
        <fieldset>
          <div class="fieldset-wrapper">
              <legend>Informações do Evento</legend>
            <div class="input-wrapper">
                <label for="event-title">Titulo do evento <span>(Minimo 8 caracteres)</span></label>
                <input type="text" id="event-title"  minlength="9">
            </div>

             <div class="input-wrapper">
                <label for="event-link">Link do evento <span>(comece com https://)</span></label>
                <input type="text" id="event-link" required>
            </div>

             <div class="input-wrapper">
                <label for="event-whats">Whatsapp<span>(Somente Números)</span></label>
                <input type="number" id="event-whats" >
            </div>

             <div class="input-wrapper">
                <label for="event-info">Informações extras</label>
                 <textarea id="event-info"></textarea>
            </div>

              <div class="input-wrapper">
                <label for="event-categoria">Categoria</label>
                <select id="event-categoria">
                    <option value="live">Ao vivo</option>
                    <option value="Podcast">Podcast</option>
                    <option value="Mentorship">Mentorship</option>
                </select>
            </div>

          </div>
          
        </fieldset>

          <fieldset>
          <div class="fieldset-wrapper">
              <legend>Privacidade</legend>

                <div class="input-wrapper">
                <label for="event-email">Email do administrador <span>(Digite um email valido)</span></label>
                <input type="email" id="event-email" required>
            </div>

              <div class="input-wrapper">
                <label for="event-senha">Senha de acesso para os participantes<span>(Minimo 8 caracteres)</span></label>
                <input type="password" id="event-senha" required>
            </div>

          <!----
              <div class="checkbox-wraper">
                <label for="event-private">Evento Privado</label>
                <input type="checkbox" id="event-private">
            </div>
        -->

            </div>
             <div class="fieldset-wrapper">
              <legend>Dia e hora</legend>
              <div class="col-3">

                <div class="input-wrapper">
                <label for="event-data">Data</label>
                <input type="date" id="event-data">
            </div>

              <div class="input-wrapper">
                <label for="event-begin">Das</label>
                <input type="time" id="event-begin">
            </div>

            <div class="input-wrapper">
                <label for="event-end">Até</label>
                <input type="time" id="event-end">
            </div>

            </div>

          
            </div>
        </fieldset>

        
    </form>

    <footer>
        <input
         type="submit" 
        value="Salvar Evento" 
        class="button"
        form="my-form"
        >
    </footer>
</div>
</body>
</html>
